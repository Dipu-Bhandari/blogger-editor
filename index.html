<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Blogger Editor</title>
    <style>
        /* CSS styles remain the same as the original */
        :root {
            --light-bg: #fff;
            --light-text: #212529;
            --light-border: #e0e0e0;
            --light-secondary-bg: #f8f9fa;
            --light-hover-bg: #f1f3f4;
            --brand-color: #1a73e8;

            --dark-body-bg: #0f0d15;
            --dark-editor-bg: #1c1822;
            --dark-text: #e8e6f1;
            --dark-border: #2d2635;
            --dark-secondary-bg: #2a2431;
            --dark-hover-bg: #3a3a3a;
            --dark-link: #ffb066;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: var(--light-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        /* Header - Minimal */
        .header {
            background: var(--light-bg);
            border-bottom: 1px solid var(--light-border);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: var(--brand-color);
        }

        #title {
            flex: 1;
            border: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            background: var(--light-secondary-bg);
            max-width: 500px;
        }

        #title:focus {
            outline: 2px solid var(--brand-color);
            background: #fff;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .blog-select {
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            background: var(--light-bg);
            cursor: pointer;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--brand-color);
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
        }

        .btn-secondary {
            background: #fff;
            color: #5f6368;
            border: 1px solid #dadce0;
        }

        .btn-secondary:hover {
            background: var(--light-hover-bg);
        }

        /* Toolbar - Flat & Minimal */
        .toolbar {
            background: var(--light-bg);
            border-bottom: 1px solid var(--light-border);
            padding: 8px 20px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }

        .toolbar button {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .toolbar button:hover {
            background: var(--light-hover-bg);
        }

        .toolbar-divider {
            width: 1px;
            background: var(--light-border);
            margin: 0 4px;
        }

        /* Editor Area */
        .editor-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            background: var(--light-bg);
            transition: background-color 0.3s ease;
        }

        #editor {
            max-width: 900px;
            margin: 0 auto;
            min-height: calc(100vh - 200px);
            outline: none;
            font-size: 18px;
            line-height: 1.6;
            color: var(--light-text);
        }

        #editor:empty:before {
            content: 'Start writing...';
            color: #9aa0a6;
        }
        
        #editor a { color: var(--brand-color); }
        #editor h1, #editor h2, #editor h3 { margin-top: 1.5em; margin-bottom: 0.5em; font-weight: 600; }

        /* === NEW: Professional Table Styling for Editor Preview === */
        #editor table {
            width: 100%;
            margin: 1.5rem 0;
            border-collapse: collapse;
            font-size: 0.9em;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-radius: 8px;
            overflow: hidden;
        }

        #editor th, #editor td {
            padding: 12px 15px;
            text-align: left;
            border: 1px solid #e0e0e0;
        }

        #editor th {
            background-color: var(--light-secondary-bg);
            color: var(--light-text);
            font-weight: 600;
        }

        #editor tbody tr:nth-of-type(even) {
            background-color: #f8f9fa;
        }

        /* === NEW: Dark Mode Preview Styles === */
        body.dark-mode {
            background: #1a1520;
        }
        body.dark-mode .header, body.dark-mode .toolbar {
            background: var(--dark-editor-bg);
            border-bottom-color: var(--dark-border);
        }
        body.dark-mode .toolbar button, body.dark-mode .logo, body.dark-mode .btn-secondary {
            color: var(--dark-text);
        }
        body.dark-mode .toolbar button:hover {
            background: var(--dark-hover-bg);
        }
        body.dark-mode .btn-secondary {
            background: var(--dark-secondary-bg);
            border-color: var(--dark-border);
        }
        body.dark-mode .editor-wrapper {
            background: var(--dark-body-bg);
        }
        body.dark-mode #editor {
            color: var(--dark-text);
        }
        body.dark-mode #editor a {
            color: var(--dark-link);
        }
        body.dark-mode #editor h1, body.dark-mode #editor h2, body.dark-mode #editor h3 {
            color: #fff;
        }
        body.dark-mode #editor table {
            box-shadow: 0 2px 15px rgba(0,0,0,0.2);
        }
        body.dark-mode #editor th, body.dark-mode #editor td {
            border: 1px solid var(--dark-border);
        }
        body.dark-mode #editor th {
            background-color: var(--dark-secondary-bg);
            color: #f5f3fc;
        }
        body.dark-mode #editor tbody tr {
            background-color: #16121a;
        }
        body.dark-mode #editor tbody tr:nth-of-type(even) {
            background-color: #1a1520;
        }

        /* Other original styles... */
        .status { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: 4px; font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); z-index: 1000; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateY(100px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .status.success { background: #0f9d58; color: white; }
        .status.error { background: #d93025; color: white; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; border-radius: 8px; padding: 24px; max-width: 400px; width: 90%; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">Blogger</div>
            <input type="text" id="title" placeholder="Post title" aria-label="Post title" />
        </div>
        <div class="header-actions">
            <select id="blogSelect" class="blog-select hidden" aria-label="Select Blog"></select>
            <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
            <button class="btn btn-primary" onclick="publish()">Publish</button>
            <button class="btn btn-secondary" id="authBtn" onclick="signIn()">Sign In</button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar" role="toolbar" aria-label="Text formatting toolbar">
        <button onclick="execCmd('bold')" aria-label="Bold"><b>B</b></button>
        <button onclick="execCmd('italic')" aria-label="Italic"><i>I</i></button>
        <button onclick="execCmd('underline')" aria-label="Underline"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')" aria-label="Strikethrough"><s>S</s></button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('formatBlock', 'h2')" aria-label="Heading 2">H2</button>
        <button onclick="execCmd('formatBlock', 'h3')" aria-label="Heading 3">H3</button>
        <button onclick="execCmd('formatBlock', 'p')" aria-label="Paragraph">P</button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('insertUnorderedList')" aria-label="Bullet List">List</button>
        <button onclick="execCmd('insertOrderedList')" aria-label="Numbered List">1. List</button>
        <button onclick="execCmd('formatBlock', 'blockquote')" aria-label="Quote">" Quote</button>
        <div class="toolbar-divider"></div>
        <button onclick="openModal('linkModal')" aria-label="Insert Link">🔗 Link</button>
        <button onclick="openModal('imageModal')" aria-label="Insert Image">🖼️ Image</button>
        <button onclick="openModal('tableModal')" aria-label="Insert Table">📊 Table</button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('removeFormat')" aria-label="Clear Formatting">✕ Clear</button>
        <!-- NEW: Dark Mode Preview Button -->
        <div class="toolbar-divider"></div>
        <button onclick="toggleDarkModePreview(event)" aria-label="Toggle Dark Mode Preview"><span aria-hidden="true">🌙</span> Preview Dark</button>
    </div>

    <!-- Editor -->
    <main class="editor-container">
        <div class="editor-wrapper">
            <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Main content editor"></div>
        </div>
    </main>

    <!-- Modals (unchanged) -->
    <div class="modal" id="tableModal">...</div>
    <div class="modal" id="linkModal">...</div>
    <div class="modal" id="imageModal">...</div>

    <script>
        // All original JavaScript is here...
        const CLIENT_ID = '942968999133-nuldtmg604hjfogobnpeaq55vhd0v4tr.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/blogger';
        let accessToken = null;
        let blogs = [];
        let lastSelectionRange = null;

        // --- NEW: Dark Mode Preview Function ---
        function toggleDarkModePreview(event) {
            document.body.classList.toggle('dark-mode');
            const btn = event.currentTarget;
            if (document.body.classList.contains('dark-mode')) {
                btn.innerHTML = '<span aria-hidden="true">☀️</span> Preview Light';
            } else {
                btn.innerHTML = '<span aria-hidden="true">🌙</span> Preview Dark';
            }
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editor').focus();
        }

        function insertHTML(html) {
            restoreSelection();
            document.execCommand('insertHTML', false, html);
        }

        // --- UPDATED: createTable function ---
        function createTable() {
            const rows = parseInt(document.getElementById('tableRows').value);
            const cols = parseInt(document.getElementById('tableCols').value);
            
            if (isNaN(rows) || isNaN(cols) || rows < 1 || cols < 1) {
                showStatus('Invalid table size', 'error');
                return;
            }

            let table = '<table><thead><tr>';
            for (let i = 0; i < cols; i++) table += '<th contenteditable="true">Header ' + (i + 1) + '</th>';
            table += '</tr></thead><tbody>';
            for (let i = 0; i < rows; i++) {
                table += '<tr>';
                for (let j = 0; j < cols; j++) table += '<td contenteditable="true">Data</td>';
                table += '</tr>';
            }
            table += '</tbody></table>';
            
            // NEW: Wrap the table in a responsive div
            const finalHtml = `<div class="table-responsive-wrapper">${table}</div><p><br></p>`;
            
            insertHTML(finalHtml);
            closeModal();
        }

        // --- UPDATED: formatForBlogger function ---
        function formatForBlogger(html) {
            // No longer need to add a generic wrapper div here,
            // as the theme and specific element wrappers (like for tables) handle it better.
            return html;
        }
        
        // ... (The rest of your original JavaScript for authentication, publishing, etc., goes here and remains unchanged)

        function saveSelection() {
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                lastSelectionRange = selection.getRangeAt(0);
            }
        }

        function restoreSelection() {
            if (lastSelectionRange) {
                const selection = window.getSelection();
                selection.removeAllRanges();
                selection.addRange(lastSelectionRange);
            }
        }

        // (loadGoogleAPI, signIn, publishPost, and other functions are unchanged)

    </script>
</body>
</html>
