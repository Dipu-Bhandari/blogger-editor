<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Blogger Editor</title>
    <style>
        /* ────────────────────── BASIC EDITOR LAYOUT ────────────────────── */
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
            background:#f5f5f5;color:#212529;height:100vh;display:flex;flex-direction:column;
        }
        .header{background:#fff;border-bottom:1px solid #e0e0e0;padding:12px 20px;
            display:flex;justify-content:space-between;align-items:center;gap:20px;}
        .header-left{display:flex;align-items:center;gap:20px;flex:1;}
        .logo{font-size:18px;font-weight:600;color:#1a73e8;}
        #title{flex:1;border:none;font-size:16px;padding:8px 12px;border-radius:4px;
            background:#f8f9fa;max-width:500px;}
        #title:focus{outline:2px solid #1a73e8;background:#fff;}
        .header-actions{display:flex;gap:8px;align-items:center;}
        .blog-select{padding:8px 12px;border:1px solid #dadce0;border-radius:4px;
            font-size:14px;background:#fff;cursor:pointer;}
        .btn{padding:8px 16px;border:none;border-radius:4px;cursor:pointer;
            font-size:14px;font-weight:500;transition:all .2s;}
        .btn-primary{background:#1a73e8;color:#fff;}
        .btn-primary:hover{background:#1557b0;}
        .btn-secondary{background:#fff;color:#5f6368;border:1px solid #dadce0;}
        .btn-secondary:hover{background:#f8f9fa;}

        .toolbar{background:#fff;border-bottom:1px solid #e0e0e0;padding:8px 20px;
            display:flex;gap:4px;overflow-x:auto;}
        .toolbar button{background:transparent;border:none;padding:6px 10px;
            border-radius:4px;cursor:pointer;font-size:14px;color:#5f6368;
            display:flex;align-items:center;gap:6px;white-space:nowrap;}
        .toolbar button:hover{background:#f1f3f4;}
        .toolbar button:active{background:#e8eaed;}
        .toolbar button.active{background:#e0e0e0;color:#1a73e8;font-weight:600;}
        .toolbar-divider{width:1px;background:#e0e0e0;margin:0 4px;}

        .editor-container{flex:1;display:flex;overflow:hidden;}
        .editor-wrapper{flex:1;overflow-y:auto;padding:40px 20px;background:#fff;}
        #editor{max-width:900px;margin:0 auto;min-height:calc(100vh - 200px);
            outline:none;font-size:16px;line-height:1.6;color:#212529;}
        #editor:empty:before{content:'Start writing...';color:#9aa0a6;}
        #editor:focus:before{content:'';}

        /* ────────────────────── LIVE-SITE STYLES (LIGHT + DARK) ────────────────────── */
        :root{
            --jt-primary:#f67938;
            --bs-body-bg:#ffffff;
            --bs-body-color:#212529;
        }
        .dark-mode{
            --bs-body-bg:#1a1a1a;
            --bs-body-color:#e0e0e0;
        }
        body.dark-mode{background:#121212;color:#e0e0e0;}
        .dark-mode .header,.dark-mode .toolbar,.dark-mode .editor-wrapper{background:#1e1e1e;}
        .dark-mode #title{background:#2d2d2d;color:#e0e0e0;border:1px solid #444;}
        .dark-mode .btn-secondary{background:#2d2d2d;color:#bbb;border:1px solid #444;}
        .dark-mode .btn-secondary:hover{background:#3a3a3a;}
        .dark-mode .toolbar button{color:#bbb;}
        .dark-mode .toolbar button:hover{background:#333;}

        /* ────────────────────── RESPONSIVE TABLE (injected into posts) ────────────────────── */
        .responsive-table{
            overflow-x:auto;margin:20px 0;border-radius:8px;
            box-shadow:0 1px 3px rgba(0,0,0,.1);
        }
        .responsive-table table{
            width:100%;min-width:600px;border-collapse:collapse;
            font-size:15px;line-height:1.5;background:var(--bs-body-bg);
        }
        .responsive-table th{
            background:#f5f5f5;color:#333;font-weight:600;text-align:left;
        }
        .responsive-table th,
        .responsive-table td{
            padding:12px 14px;border:1px solid #ddd;
            word-wrap:break-word;max-width:300px;
        }
        .responsive-table tr:hover{background:#f9f9f9;}
        .responsive-table tr:nth-child(even){background:#fafafa;}

        /* DARK MODE overrides */
        .dark-mode .responsive-table table{background:#1a1a1a;color:#e0e0e0;}
        .dark-mode .responsive-table th{background:#2d2d2d !important;color:#fff !important;}
        .dark-mode .responsive-table td{border-color:#444 !important;}
        .dark-mode .responsive-table tr:hover{background:#2a2a2a !important;}
        .dark-mode .responsive-table tr:nth-child(even){background:#222;}

        @media (max-width:768px){
            .responsive-table table{font-size:14px;}
            .responsive-table th,
            .responsive-table td{padding:10px 8px;}
        }

        /* ────────────────────── OTHER EDITOR CONTENT STYLES ────────────────────── */
        #editor table{width:100%;border-collapse:collapse;margin:20px 0;background:#fff;}
        #editor th,#editor td{border:1px solid #dadce0;padding:12px;text-align:left;min-width:100px;}
        #editor th{background:#f8f9fa;font-weight:600;}
        #editor tr:hover{background:#f8f9fa;}
        #editor td:focus,#editor th:focus{outline:2px solid #1a73e8;background:#fff;}
        #editor img{max-width:100%;height:auto;margin:20px 0;border-radius:4px;}
        #editor h1,#editor h2,#editor h3,#editor h4{margin-top:24px;margin-bottom:12px;font-weight:600;}
        #editor h1{font-size:32px;}#editor h2{font-size:24px;}#editor h3{font-size:20px;}#editor h4{font-size:18px;}
        #editor ul,#editor ol{margin:16px 0;padding-left:24px;}
        #editor li{margin:8px 0;}
        #editor blockquote{border-left:4px solid #1a73e8;margin:20px 0;padding:12px 20px;
            background:#f8f9fa;font-style:italic;}
        #editor code{background:#f1f3f4;padding:2px 6px;border-radius:3px;font-family:monospace;font-size:.9em;}
        #editor pre{background:#f1f3f4;padding:16px;border-radius:4px;overflow-x:auto;margin:16px 0;}
        #editor pre code{background:transparent;padding:0;}
        #editor a{color:#1a73e8;text-decoration:none;}
        #editor a:hover{text-decoration:underline;}

        .status{position:fixed;bottom:20px;right:20px;padding:12px 20px;
            border-radius:4px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15);
            z-index:1000;animation:slideIn .3s ease;}
        @keyframes slideIn{from{transform:translateY(100px);opacity:0;}
            to{transform:translateY(0);opacity:1;}}
        .status.success{background:#0f9d58;color:#fff;}
        .status.error{background:#d93025;color:#fff;}
        .status.info{background:#1a73e8;color:#fff;}

        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
            background:rgba(0,0,0,.5);z-index:2000;align-items:center;justify-content:center;}
        .modal.active{display:flex;}
        .modal-content{background:#fff;border-radius:8px;padding:24px;max-width:400px;
            width:90%;box-shadow:0 8px 24px rgba(0,0,0,.2);}
        .modal-header{font-size:18px;font-weight:600;margin-bottom:16px;}
        .modal-body{margin-bottom:20px;}
        .modal-body label{display:block;font-size:14px;font-weight:500;margin-bottom:6px;}
        .modal-input{width:100%;padding:10px;border:1px solid #dadce0;
            border-radius:4px;font-size:14px;margin-bottom:12px;}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end;}
        .hidden{display:none;}

        @media (max-width:768px){
            .header{flex-direction:column;gap:10px;}
            .header-left{width:100%;flex-direction:column;}
            #title{max-width:100%;}
            .toolbar{padding:8px 10px;}
            .editor-wrapper{padding:20px 15px;}
            #editor{font-size:15px;}
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">Blogger</div>
            <label for="title" class="hidden">Post Title</label>
            <input type="text" id="title" placeholder="Post title" aria-label="Post title"/>
        </div>
        <div class="header-actions">
            <label for="blogSelect" class="hidden">Select Blog</label>
            <select id="blogSelect" class="blog-select hidden" aria-label="Select your blog">
                <option value="">Select blog...</option>
            </select>
            <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
            <button class="btn btn-primary" onclick="publish()">Publish</button>
            <button class="btn btn-secondary" id="authBtn" onclick="signIn()">Sign In</button>
        </div>
    </header>

    <!-- Toolbar -->
    <div class="toolbar" role="toolbar" aria-label="Text formatting toolbar">
        <button onclick="execCmd('bold')" aria-label="Bold (Ctrl+B)" title="Bold (Ctrl+B)"><b>B</b></button>
        <button onclick="execCmd('italic')" aria-label="Italic (Ctrl+I)" title="Italic (Ctrl+I)"><i>I</i></button>
        <button onclick="execCmd('underline')" aria-label="Underline (Ctrl+U)" title="Underline (Ctrl+U)"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')" aria-label="Strikethrough" title="Strikethrough"><s>S</s></button>
        <div class="toolbar-divider"></div>

        <button onclick="execCmd('formatBlock','h1')" aria-label="Heading 1" title="Heading 1">H1</button>
        <button onclick="execCmd('formatBlock','h2')" aria-label="Heading 2" title="Heading 2">H2</button>
        <button onclick="execCmd('formatBlock','h3')" aria-label="Heading 3" title="Heading 3">H3</button>
        <button onclick="execCmd('formatBlock','p')" aria-label="Paragraph" title="Paragraph">P</button>
        <div class="toolbar-divider"></div>

        <button onclick="execCmd('insertUnorderedList')" aria-label="Bullet List" title="Bullet List">• List</button>
        <button onclick="execCmd('insertOrderedList')" aria-label="Numbered List" title="Numbered List">1. List</button>
        <button onclick="execCmd('formatBlock','blockquote')" aria-label="Quote" title="Quote">" Quote</button>
        <div class="toolbar-divider"></div>

        <!-- Alignment Buttons -->
        <button id="alignLeft" onclick="alignText('justifyLeft')" aria-label="Align Left (Ctrl+Shift+L)" title="Align Left (Ctrl+Shift+L)">Left</button>
        <button id="alignCenter" onclick="alignText('justifyCenter')" aria-label="Align Center (Ctrl+Shift+C)" title="Align Center (Ctrl+Shift+C)">Center</button>
        <button id="alignRight" onclick="alignText('justifyRight')" aria-label="Align Right (Ctrl+Shift+R)" title="Align Right (Ctrl+Shift+R)">Right</button>
        <button id="alignJustify" onclick="alignText('justifyFull')" aria-label="Justify (Ctrl+Shift+J)" title="Justify (Ctrl+Shift+J)">Justify</button>
        <div class="toolbar-divider"></div>

        <button onclick="openModal('linkModal')" aria-label="Insert Link" title="Insert Link">Link</button>
        <button onclick="openModal('imageModal')" aria-label="Insert Image" title="Insert Image">Image</button>
        <button onclick="openModal('tableModal')" aria-label="Insert Table" title="Insert Table">Table</button>
        <div class="toolbar-divider"></div>

        <button onclick="execCmd('removeFormat')" aria-label="Clear Formatting" title="Clear Formatting">X Clear</button>
    </div>

    <!-- Editor -->
    <main class="editor-container">
        <div class="editor-wrapper">
            <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" 
                 aria-label="Main content editor. Use toolbar buttons or keyboard shortcuts for formatting."
                 spellcheck="true"></div>
        </div>
    </main>

    <!-- Table Modal -->
    <div class="modal" id="tableModal" role="dialog" aria-modal="true" aria-labelledby="tableModalHeader">
        <div class="modal-content">
            <h2 class="modal-header" id="tableModalHeader">Insert Table</h2>
            <div class="modal-body">
                <label for="tableRows">Rows</label>
                <input type="number" id="tableRows" class="modal-input" placeholder="e.g., 3" min="1" max="20" value="3" aria-describedby="tableRowsDesc">
                <label for="tableCols">Columns</label>
                <input type="number" id="tableCols" class="modal-input" placeholder="e.g., 3" min="1" max="10" value="3" aria-describedby="tableColsDesc">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createTable()">Insert</button>
            </div>
        </div>
    </div>

    <!-- Link Modal -->
    <div class="modal" id="linkModal" role="dialog" aria-modal="true" aria-labelledby="linkModalHeader">
        <div class="modal-content">
            <h2 class="modal-header" id="linkModalHeader">Insert Link</h2>
            <div class="modal-body">
                <label for="linkText">Link text</label>
                <input type="text" id="linkText" class="modal-input" placeholder="Link text" aria-describedby="linkTextDesc">
                <label for="linkUrl">URL</label>
                <input type="url" id="linkUrl" class="modal-input" placeholder="https://example.com" aria-describedby="linkUrlDesc">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createLink()">Insert</button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="imageModalHeader">
        <div class="modal-content">
            <h2 class="modal-header" id="imageModalHeader">Insert Image</h2>
            <div class="modal-body">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" class="modal-input" placeholder="Image URL" aria-describedby="imageUrlDesc">
                <label for="imageAlt">Alt text (for accessibility)</label>
                <input type="text" id="imageAlt" class="modal-input" placeholder="e.g., a cat sitting on a windowsill" aria-describedby="imageAltDesc">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createImage()">Insert</button>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '942968999133-nuldtmg604hjfogobnpeaq55vhd0v4tr.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/blogger';
        let accessToken = null, blogs = [], lastSelectionRange = null;

        /* ---------- GOOGLE SIGN-IN ---------- */
        function loadGoogleAPI(){
            const s=document.createElement('script');
            s.src='https://accounts.google.com/gsi/client';s.onload=initializeGoogleSignIn;
            document.head.appendChild(s);
        }
        function initializeGoogleSignIn(){
            google.accounts.id.initialize({client_id:CLIENT_ID,callback:()=>{} });
        }
        function signIn(){
            const client=google.accounts.oauth2.initTokenClient({
                client_id:CLIENT_ID,scope:SCOPES,
                callback:r=>{if(r.access_token){accessToken=r.access_token;onSignIn();}}
            });
            client.requestAccessToken();
        }
        async function onSignIn(){
            document.getElementById('authBtn').textContent='Signed In';
            document.getElementById('authBtn').disabled=true;
            await loadUserBlogs();showStatus('Signed in successfully','success');
        }
        async function loadUserBlogs(){
            try{
                const r=await fetch('https://www.googleapis.com/blogger/v3/users/self/blogs',{
                    headers:{'Authorization':`Bearer ${accessToken}`}
                });
                const d=await r.json();blogs=d.items||[];
                const sel=document.getElementById('blogSelect');
                sel.innerHTML='<option value="">Select blog...</option>';
                blogs.forEach(b=>{const o=document.createElement('option');
                    o.value=b.id;o.textContent=b.name;sel.appendChild(o);});
                sel.classList.remove('hidden');
            }catch(e){showStatus('Error loading blogs','error');}
        }

        /* ---------- SELECTION HELPERS ---------- */
        function saveSelection(){
            const s=window.getSelection();
            if(s.rangeCount>0) lastSelectionRange=s.getRangeAt(0);
        }
        function restoreSelection(){
            if(lastSelectionRange){
                const s=window.getSelection();s.removeAllRanges();s.addRange(lastSelectionRange);
            }
        }

        /* ---------- BASIC COMMANDS ---------- */
        function execCmd(c,v=null){document.execCommand(c,false,v);document.getElementById('editor').focus();}
        function insertHTML(h){restoreSelection();document.execCommand('insertHTML',false,h);}

        /* ---------- TEXT ALIGNMENT ---------- */
        function alignText(alignCmd){
            document.execCommand(alignCmd, false, null);
            updateAlignmentButtons();
            document.getElementById('editor').focus();
        }

        function updateAlignmentButtons(){
            const buttons = ['alignLeft','alignCenter','alignRight','alignJustify'];
            buttons.forEach(id => {
                const btn = document.getElementById(id);
                if (btn) btn.classList.remove('active');
            });
            const align = document.queryCommandState('justifyLeft') ? 'alignLeft' :
                          document.queryCommandState('justifyCenter') ? 'alignCenter' :
                          document.queryCommandState('justifyRight') ? 'alignRight' :
                          document.queryCommandState('justifyFull') ? 'alignJustify' : null;
            if (align) document.getElementById(align).classList.add('active');
        }

        /* ---------- KEYBOARD SHORTCUTS FOR ALIGNMENT ---------- */
        document.addEventListener('keydown', e => {
            if (e.ctrlKey && e.shiftKey) {
                if (e.key === 'L') { e.preventDefault(); alignText('justifyLeft'); }
                else if (e.key === 'C') { e.preventDefault(); alignText('justifyCenter'); }
                else if (e.key === 'R') { e.preventDefault(); alignText('justifyRight'); }
                else if (e.key === 'J') { e.preventDefault(); alignText('justifyFull'); }
            }
        });

        /* ---------- MODALS ---------- */
        function openModal(id){
            saveSelection();
            const modal = document.getElementById(id);
            modal.classList.add('active');
            // Focus first input and select text if present
            const first=modal.querySelector('input, select');
            if(first) {
                setTimeout(() => {
                    first.focus();
                    if(first.type === 'text' || first.type === 'url') first.select();
                }, 100);
            }
            // Trap focus within modal
            modal.setAttribute('aria-hidden', 'false');
        }
        function closeModal(){
            document.querySelectorAll('.modal.active').forEach(m=>{
                m.classList.remove('active');
                m.setAttribute('aria-hidden', 'true');
            });
            document.getElementById('editor').focus();
        }

        /* ---------- TABLE (responsive + dark-mode ready) ---------- */
        function createTable(){
            const rows=parseInt(document.getElementById('tableRows').value);
            const cols=parseInt(document.getElementById('tableCols').value);
            if(isNaN(rows)||isNaN(cols)||rows<1||cols<1){showStatus('Invalid table size','error');return;}
            let html='<div class="responsive-table"><table><thead><tr>';
            for(let i=0;i<cols;i++) html+=`<th contenteditable="true">Header ${i+1}</th>`;
            html+='</tr></thead><tbody>';
            for(let i=0;i<rows;i++){
                html+='<tr>';
                for(let j=0;j<cols;j++) html+='<td contenteditable="true">Data</td>';
                html+='</tr>';
            }
            html+='</tbody></table></div><p><br></p>';
            insertHTML(html);closeModal();
        }

        /* ---------- LINK & IMAGE ---------- */
        function createLink(){
            const text=document.getElementById('linkText').value;
            const url=document.getElementById('linkUrl').value;
            if(!url){showStatus('Please enter a URL','error');return;}
            insertHTML(`<a href="${url}" target="_blank" rel="noopener noreferrer">${text||url}</a>`);closeModal();
        }
        function createImage(){
            const url=document.getElementById('imageUrl').value;
            const alt=document.getElementById('imageAlt').value;
            if(!url){showStatus('Please enter an image URL','error');return;}
            // Wrap image in a link so it's clickable on the live site
            const imgHTML=`<a href="${url}" target="_blank" rel="noopener noreferrer" style="display:inline-block;">
                <img src="${url}" alt="${alt||'Image'}" style="max-width:100%;height:auto;cursor:pointer;display:block;">
            </a><p><br></p>`;
            insertHTML(imgHTML);
            closeModal();
        }

        /* ---------- PUBLISH / DRAFT ---------- */
        async function publish(){await publishPost(false);}
        async function saveDraft(){await publishPost(true);}
        async function publishPost(isDraft){
            const title=document.getElementById('title').value.trim();
            const content=document.getElementById('editor').innerHTML.trim();
            const blogId=document.getElementById('blogSelect').value;
            if(!title||!content){showStatus('Title & content required','error');return;}
            if(!blogId){showStatus('Select a blog','error');return;}
            if(!accessToken){showStatus('Sign in first','error');return;}
            const post={kind:'blogger#post',blog:{id:blogId},title:title,content:formatForBlogger(content)};
            try{
                const url=`https://www.googleapis.com/blogger/v3/blogs/${blogId}/posts/${isDraft?'?isDraft=true':''}`;
                const r=await fetch(url,{method:'POST',headers:{
                    'Authorization':`Bearer ${accessToken}`,'Content-Type':'application/json'
                },body:JSON.stringify(post)});
                if(r.ok){
                    const res=await r.json();
                    showStatus(isDraft?'Saved as draft':'Published!','success');
                    if(!isDraft && res.url) setTimeout(()=>window.open(res.url,'_blank'),1000);
                }else{
                    const e=await r.json();showStatus(`Failed: ${e.error.message}`,'error');
                }
            }catch(e){showStatus('Error: '+e.message,'error');}
        }

        /* ---------- INJECT RESPONSIVE + DARK-MODE CSS INTO EVERY POST ---------- */
        function formatForBlogger(html){
            const tableCSS=`
                <style>
                    .responsive-table{overflow-x:auto;margin:20px 0;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1);}
                    .responsive-table table{width:100%;min-width:600px;border-collapse:collapse;font-size:15px;line-height:1.5;background:var(--bs-body-bg);}
                    .responsive-table th{background:#f5f5f5;color:#333;font-weight:600;text-align:left;}
                    .responsive-table th,.responsive-table td{padding:12px 14px;border:1px solid #ddd;word-wrap:break-word;max-width:300px;}
                    .responsive-table tr:hover{background:#f9f9f9;}
                    .responsive-table tr:nth-child(even){background:#fafafa;}
                    .dark-mode .responsive-table table{background:#1a1a1a;color:#e0e0e0;}
                    .dark-mode .responsive-table th{background:#2d2d2d !important;color:#fff !important;}
                    .dark-mode .responsive-table td{border-color:#444 !important;}
                    .dark-mode .responsive-table tr:hover{background:#2a2a2a !important;}
                    .dark-mode .responsive-table tr:nth-child(even){background:#222;}
                    @media(max-width:768px){
                        .responsive-table table{font-size:14px;}
                        .responsive-table th,.responsive-table td{padding:10px 8px;}
                    }
                </style>`;
            const wrapped=html.replace(/<table/g,'<div class="responsive-table"><table')
                              .replace(/<\/table>/g,'</table></div>');
            return `<div style="max-width:100%;word-wrap:break-word;overflow-wrap:break-word;">
                        ${tableCSS}${wrapped}
                    </div>`;
        }

        /* ---------- STATUS ---------- */
        function showStatus(msg,type){
            const ex=document.querySelector('.status');if(ex) ex.remove();
            const s=document.createElement('div');s.className=`status ${type}`;
            s.textContent=msg;s.setAttribute('role','status');s.setAttribute('aria-live','polite');
            document.body.appendChild(s);
            setTimeout(()=>s.remove(),4000);
        }

        /* ---------- INIT ---------- */
        document.addEventListener('DOMContentLoaded',()=>{
            loadGoogleAPI();
            updateAlignmentButtons();
            // Initialize modals as hidden for screen readers
            document.querySelectorAll('.modal').forEach(m=>m.setAttribute('aria-hidden', 'true'));
            // Add Enter key support for modal inputs
            document.querySelectorAll('.modal input').forEach(input => {
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const modal = input.closest('.modal');
                        if (modal.id === 'linkModal') createLink();
                        else if (modal.id === 'imageModal') createImage();
                        else if (modal.id === 'tableModal') createTable();
                    }
                });
            });
        });
        document.addEventListener('keydown',e=>{if(e.key==='Escape') closeModal();});
        document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',ev=>{if(ev.target===m) closeModal();}));
        document.getElementById('editor').addEventListener('keyup',saveSelection);
        document.getElementById('editor').addEventListener('mouseup',saveSelection);
        document.getElementById('editor').addEventListener('click',updateAlignmentButtons);
        document.getElementById('editor').addEventListener('keyup',updateAlignmentButtons);
    </script>
</body>
</html>
