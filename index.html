<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogger Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #212529;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex: 1;
        }

        .logo {
            font-size: 18px;
            font-weight: 600;
            color: #1a73e8;
        }

        #title {
            flex: 1;
            border: none;
            font-size: 16px;
            padding: 8px 12px;
            border-radius: 4px;
            background: #f8f9fa;
            max-width: 500px;
        }

        #title:focus {
            outline: 2px solid #1a73e8;
            background: #fff;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .blog-select {
            padding: 8px 12px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
        }

        .btn-secondary {
            background: #fff;
            color: #5f6368;
            border: 1px solid #dadce0;
        }

        .btn-secondary:hover {
            background: #f8f9fa;
        }

        .toolbar {
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            padding: 8px 20px;
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }

        .toolbar button {
            background: transparent;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            color: #5f6368;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .toolbar button:hover {
            background: #f1f3f4;
        }

        .toolbar-divider {
            width: 1px;
            background: #e0e0e0;
            margin: 0 4px;
        }

        .editor-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .editor-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            background: #fff;
        }

        #editor {
            max-width: 900px;
            margin: 0 auto;
            min-height: calc(100vh - 200px);
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            color: #212529;
        }

        #editor:empty:before {
            content: 'Start writing...';
            color: #9aa0a6;
        }

        #editor:focus:before {
            content: '';
        }

        /* FIXED: Consistent table styling for light AND dark mode */
        #editor table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: #fff;
            table-layout: fixed;
            border: 2px solid #dadce0;
        }

        #editor table th,
        #editor table td {
            border: 1px solid #dadce0;
            padding: 12px;
            text-align: left;
            min-width: 100px;
            position: relative;
            background: #fff;
        }

        #editor table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #202124;
        }

        #editor table tr:hover td {
            background: #f8f9fa;
        }

        #editor table td[contenteditable="true"],
        #editor table th[contenteditable="true"] {
            cursor: text;
        }

        #editor table td:focus,
        #editor table th:focus {
            outline: 2px solid #1a73e8;
            background: #fff;
        }

        #editor img {
            max-width: 100%;
            height: auto;
            margin: 20px 0;
            border-radius: 4px;
            display: block;
        }

        #editor h1, #editor h2, #editor h3, #editor h4 {
            margin-top: 24px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        #editor h1 { font-size: 32px; }
        #editor h2 { font-size: 24px; }
        #editor h3 { font-size: 20px; }
        #editor h4 { font-size: 18px; }

        #editor ul, #editor ol {
            margin: 16px 0;
            padding-left: 24px;
        }

        #editor li {
            margin: 8px 0;
        }

        #editor blockquote {
            border-left: 4px solid #1a73e8;
            margin: 20px 0;
            padding: 12px 20px;
            background: #f8f9fa;
            font-style: italic;
        }

        #editor code {
            background: #f1f3f4;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            font-size: 0.9em;
        }

        #editor pre {
            background: #f1f3f4;
            padding: 16px;
            border-radius: 4px;
            overflow-x: auto;
            margin: 16px 0;
        }

        #editor a {
            color: #1a73e8;
            text-decoration: none;
        }

        #editor a:hover {
            text-decoration: underline;
        }

        .status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .status.success { background: #0f9d58; color: white; }
        .status.error { background: #d93025; color: white; }
        .status.info { background: #1a73e8; color: white; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 24px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #202124;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-body label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
            color: #5f6368;
        }

        .modal-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 12px;
            color: #202124;
            background: #fff;
        }

        .modal-input:focus {
            outline: 2px solid #1a73e8;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .hidden { display: none; }

        @media (max-width: 768px) {
            .header { flex-direction: column; gap: 10px; }
            .header-left { width: 100%; flex-direction: column; }
            #title { max-width: 100%; }
            .toolbar { padding: 8px 10px; }
            .editor-wrapper { padding: 20px 15px; }
            #editor { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">Blogger</div>
            <input type="text" id="title" placeholder="Post title" />
        </div>
        <div class="header-actions">
            <select id="blogSelect" class="blog-select hidden">
                <option value="">Select blog...</option>
            </select>
            <button class="btn btn-secondary" onclick="saveDraft()">Save Draft</button>
            <button class="btn btn-primary" onclick="publish()">Publish</button>
            <button class="btn btn-secondary" id="authBtn" onclick="signIn()">Sign In</button>
        </div>
    </div>

    <div class="toolbar">
        <button onclick="execCmd('bold')"><b>B</b></button>
        <button onclick="execCmd('italic')"><i>I</i></button>
        <button onclick="execCmd('underline')"><u>U</u></button>
        <button onclick="execCmd('strikeThrough')"><s>S</s></button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('formatBlock', 'h1')">H1</button>
        <button onclick="execCmd('formatBlock', 'h2')">H2</button>
        <button onclick="execCmd('formatBlock', 'h3')">H3</button>
        <button onclick="execCmd('formatBlock', 'p')">P</button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('insertUnorderedList')">• List</button>
        <button onclick="execCmd('insertOrderedList')">1. List</button>
        <button onclick="execCmd('formatBlock', 'blockquote')">" Quote</button>
        <div class="toolbar-divider"></div>
        <button onclick="openModal('linkModal')">🔗 Link</button>
        <button onclick="openModal('imageModal')">🖼️ Image</button>
        <button onclick="openModal('tableModal')">📊 Table</button>
        <div class="toolbar-divider"></div>
        <button onclick="execCmd('removeFormat')">✕ Clear</button>
    </div>

    <div class="editor-container">
        <div class="editor-wrapper">
            <div id="editor" contenteditable="true"></div>
        </div>
    </div>

    <div class="modal" id="tableModal">
        <div class="modal-content">
            <div class="modal-header">Insert Table</div>
            <div class="modal-body">
                <label for="tableRows">Number of Rows</label>
                <input type="number" id="tableRows" class="modal-input" min="1" max="20" value="3">
                <label for="tableCols">Number of Columns</label>
                <input type="number" id="tableCols" class="modal-input" min="1" max="10" value="3">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createTable()">Insert Table</button>
            </div>
        </div>
    </div>

    <div class="modal" id="linkModal">
        <div class="modal-content">
            <div class="modal-header">Insert Link</div>
            <div class="modal-body">
                <label for="linkText">Link text</label>
                <input type="text" id="linkText" class="modal-input" placeholder="Enter text">
                <label for="linkUrl">URL</label>
                <input type="url" id="linkUrl" class="modal-input" placeholder="https://example.com">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createLink()">Insert Link</button>
            </div>
        </div>
    </div>

    <div class="modal" id="imageModal">
        <div class="modal-content">
            <div class="modal-header">Insert Image</div>
            <div class="modal-body">
                <label for="imageUrl">Image URL</label>
                <input type="url" id="imageUrl" class="modal-input" placeholder="https://example.com/image.jpg">
                <label for="imageAlt">Alt text (optional)</label>
                <input type="text" id="imageAlt" class="modal-input" placeholder="Describe the image">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createImage()">Insert Image</button>
            </div>
        </div>
    </div>

    <script>
        const CLIENT_ID = '942968999133-nuldtmg604hjfogobnpeaq55vhd0v4tr.apps.googleusercontent.com';
        const SCOPES = 'https://www.googleapis.com/auth/blogger';
        
        let accessToken = null;
        let blogs = [];
        let savedRange = null;

        function loadGoogleAPI() {
            const script = document.createElement('script');
            script.src = 'https://accounts.google.com/gsi/client';
            script.onload = initializeGoogleSignIn;
            document.head.appendChild(script);
        }

        function initializeGoogleSignIn() {
            google.accounts.id.initialize({
                client_id: CLIENT_ID,
                callback: handleCredentialResponse
            });
        }

        function signIn() {
            const client = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: SCOPES,
                callback: (response) => {
                    if (response.access_token) {
                        accessToken = response.access_token;
                        onSignIn();
                    }
                },
            });
            client.requestAccessToken();
        }

        function handleCredentialResponse(response) {}

        async function onSignIn() {
            document.getElementById('authBtn').textContent = 'Signed In';
            document.getElementById('authBtn').disabled = true;
            await loadUserBlogs();
            showStatus('Signed in successfully', 'success');
        }

        async function loadUserBlogs() {
            try {
                const response = await fetch('https://www.googleapis.com/blogger/v3/users/self/blogs', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                
                const data = await response.json();
                blogs = data.items || [];
                
                const blogSelect = document.getElementById('blogSelect');
                blogSelect.innerHTML = '<option value="">Select blog...</option>';
                blogs.forEach(blog => {
                    const option = document.createElement('option');
                    option.value = blog.id;
                    option.textContent = blog.name;
                    blogSelect.appendChild(option);
                });
                blogSelect.classList.remove('hidden');
            } catch (error) {
                showStatus('Error loading blogs', 'error');
            }
        }

        function saveSelection() {
            const sel = window.getSelection();
            if (sel.rangeCount > 0) {
                savedRange = sel.getRangeAt(0).cloneRange();
            }
        }

        function restoreSelection() {
            if (savedRange) {
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(savedRange);
            }
        }

        function execCmd(command, value = null) {
            document.execCommand(command, false, value);
            document.getElementById('editor').focus();
        }

        function openModal(modalId) {
            saveSelection();
            
            // Reset input values when opening modal
            if (modalId === 'tableModal') {
                document.getElementById('tableRows').value = '3';
                document.getElementById('tableCols').value = '3';
            } else if (modalId === 'linkModal') {
                document.getElementById('linkText').value = '';
                document.getElementById('linkUrl').value = '';
            } else if (modalId === 'imageModal') {
                document.getElementById('imageUrl').value = '';
                document.getElementById('imageAlt').value = '';
            }
            
            document.getElementById(modalId).classList.add('active');
            
            // Focus first input
            setTimeout(() => {
                const firstInput = document.querySelector(`#${modalId} input`);
                if (firstInput) firstInput.focus();
            }, 100);
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(m => m.classList.remove('active'));
            restoreSelection();
            document.getElementById('editor').focus();
        }

        function createTable() {
            const rowsInput = document.getElementById('tableRows');
            const colsInput = document.getElementById('tableCols');
            
            const rows = parseInt(rowsInput.value);
            const cols = parseInt(colsInput.value);
            
            // Validation
            if (isNaN(rows) || isNaN(cols)) {
                showStatus('Please enter valid numbers', 'error');
                return;
            }
            
            if (rows < 1 || rows > 20) {
                showStatus('Rows must be between 1 and 20', 'error');
                return;
            }
            
            if (cols < 1 || cols > 10) {
                showStatus('Columns must be between 1 and 10', 'error');
                return;
            }

            // Create table HTML with explicit styling
            let html = '<table style="width:100%;border-collapse:collapse;margin:20px 0;background:#fff;border:2px solid #dadce0;"><thead><tr>';
            
            for (let i = 0; i < cols; i++) {
                html += `<th contenteditable="true" style="border:1px solid #dadce0;padding:12px;background:#f8f9fa;font-weight:600;color:#202124;">Header ${i + 1}</th>`;
            }
            html += '</tr></thead><tbody>';
            
            for (let i = 0; i < rows; i++) {
                html += '<tr>';
                for (let j = 0; j < cols; j++) {
                    html += `<td contenteditable="true" style="border:1px solid #dadce0;padding:12px;background:#fff;color:#202124;">Cell</td>`;
                }
                html += '</tr>';
            }
            html += '</tbody></table><p><br></p>';
            
            restoreSelection();
            document.execCommand('insertHTML', false, html);
            closeModal();
            showStatus('Table inserted! Click cells to edit', 'success');
        }

        function createLink() {
            const text = document.getElementById('linkText').value.trim();
            const url = document.getElementById('linkUrl').value.trim();
            
            if (!url) {
                showStatus('Please enter a URL', 'error');
                return;
            }
            
            restoreSelection();
            document.execCommand('insertHTML', false, `<a href="${url}" style="color:#1a73e8;">${text || url}</a>`);
            closeModal();
        }

        function createImage() {
            const url = document.getElementById('imageUrl').value.trim();
            const alt = document.getElementById('imageAlt').value.trim();
            
            if (!url) {
                showStatus('Please enter an image URL', 'error');
                return;
            }
            
            restoreSelection();
            document.execCommand('insertHTML', false, `<img src="${url}" alt="${alt || 'Image'}" style="max-width:100%;height:auto;display:block;margin:20px 0;"><p><br></p>`);
            closeModal();
        }

        async function publish() {
            await publishPost(false);
        }

        async function saveDraft() {
            await publishPost(true);
        }

        async function publishPost(isDraft) {
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('editor').innerHTML.trim();
            const blogId = document.getElementById('blogSelect').value;

            if (!title || !content) {
                showStatus('Please enter title and content', 'error');
                return;
            }
            if (!blogId) {
                showStatus('Please select a blog', 'error');
                return;
            }
            if (!accessToken) {
                showStatus('Please sign in first', 'error');
                return;
            }

            try {
                const url = `https://www.googleapis.com/blogger/v3/blogs/${blogId}/posts/${isDraft ? '?isDraft=true' : ''}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        kind: 'blogger#post',
                        blog: { id: blogId },
                        title: title,
                        content: formatForBlogger(content)
                    })
                });

                if (response.ok) {
                    const result = await response.json();
                    showStatus(isDraft ? 'Saved as draft ✓' : 'Published successfully! ✓', 'success');
                    if (!isDraft && result.url) {
                        setTimeout(() => window.open(result.url, '_blank'), 1000);
                    }
                } else {
                    const errorData = await response.json();
                    showStatus('Failed: ' + (errorData.error.message || 'Unknown error'), 'error');
                }
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function formatForBlogger(html) {
            let formatted = html;
            
            // Remove contenteditable attributes
            formatted = formatted.replace(/\scontenteditable="true"/g, '');
            
            // Ensure table styling is preserved
            formatted = formatted.replace(/<table>/g, '<div style="overflow-x:auto;margin:20px 0"><table style="width:100%;border-collapse:collapse;border:2px solid #dadce0;background:#fff;">');
            formatted = formatted.replace(/<\/table>/g, '</table></div>');
            
            // Wrap in responsive container
            formatted = `<div style="max-width:100%;word-wrap:break-word;overflow-wrap:break-word;line-height:1.6;color:#202124;">${formatted}</div>`;
            
            return formatted;
        }

        function showStatus(message, type) {
            const existing = document.querySelector('.status');
            if (existing) existing.remove();
            
            const status = document.createElement('div');
            status.className = `status ${type}`;
            status.textContent = message;
            document.body.appendChild(status);
            
            setTimeout(() => status.remove(), 4000);
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', () => {
            loadGoogleAPI();
            
            // Initialize input values
            document.getElementById('tableRows').value = '3';
            document.getElementById('tableCols').value = '3';
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        });

        document.getElementById('editor').addEventListener('keyup', saveSelection);
        document.getElementById('editor').addEventListener('mouseup', saveSelection);
        document.getElementById('editor').addEventListener('focus', saveSelection);
    </script>
</body>
</html>
